name: CI

on:
  pull_request:
  push:
    branches: [master, main]
    tags: '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} / ${{ matrix.os }} / ${{ matrix.threads }} threads
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Codecov authenticates with OIDC instead of a stored token.
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
        threads: ['1', '2,1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Run tests
        shell: julia --color=yes {0}
        env:
          CI_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.threads == '2,1' }}
        run: |
          using Pkg
          # Resolve each Julia version independently of the committed manifest.
          # Keep SMCExamples a test dependency; it depends on this package itself.
          Pkg.activate(; temp=true)
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.test("SequentialMonteCarlo";
            coverage=ENV["CI_COVERAGE"] == "true",
            julia_args=["--check-bounds=yes"])
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.threads == '2,1'
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.threads == '2,1'
        with:
          files: lcov.info
          use_oidc: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Install documentation dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Build and deploy documentation
        run: julia --color=yes --project=docs docs/make.jl ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '--deploy' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Documenter updates the versioned site on gh-pages using GITHUB_TOKEN.
      # Token-authenticated pushes do not trigger branch-based Pages builds,
      # so publish that complete site explicitly through the Pages API.
      - name: Check out versioned documentation
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: .ci/documentation-site
          persist-credentials: false
      - name: Upload documentation site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .ci/documentation-site

  pages:
    name: Publish documentation
    needs: docs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Serialize site deployments, including branch and release-tag builds.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy documentation site
        id: deployment
        uses: actions/deploy-pages@v4
