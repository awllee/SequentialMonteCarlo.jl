name: CI

on:
  pull_request:
  push:
    branches: [master, main]
    tags: '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} / ${{ matrix.os }} / ${{ matrix.threads }} threads
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Codecov authenticates with OIDC instead of a stored token.
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
        threads: ['1', '2,1']
    steps:
      - uses: actions/checkout@v7
      # Temporary until SMCExamples 0.7 is registered. Omit ref to follow its
      # default branch; the RNG migration must be pushed there before CI runs.
      - name: Check out companion examples
        uses: actions/checkout@v7
        with:
          repository: awllee/SMCExamples.jl
          path: .ci/SMCExamples
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Run tests
        shell: julia --color=yes {0}
        env:
          CI_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.threads == '2,1' }}
        run: |
          using Pkg
          # Resolve each Julia version independently of the committed manifest.
          # Keep SMCExamples a test dependency; it depends on this package itself.
          Pkg.activate(; temp=true)
          Pkg.develop([
            PackageSpec(path=pwd()),
            PackageSpec(path=joinpath(pwd(), ".ci", "SMCExamples")),
          ])
          Pkg.test("SequentialMonteCarlo";
            coverage=ENV["CI_COVERAGE"] == "true",
            julia_args=["--check-bounds=yes"])
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.threads == '2,1'
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.threads == '2,1'
        with:
          files: lcov.info
          use_oidc: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Install documentation dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Build and deploy documentation
        run: julia --color=yes --project=docs docs/make.jl ${{ github.event_name == 'push' && '--deploy' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
